<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}交易决策仪表盘{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="/static/css/style.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark top-navbar fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-graph-up-arrow me-2"></i>
                <span class="brand-text">交易决策仪表盘</span>
            </a>
            <!-- 顶部指数滚动条 -->
            <div class="index-ticker" id="indexTicker">
                <div class="ticker-content">
                    <span class="ticker-loading">加载行情中...</span>
                </div>
            </div>
            <!-- 右侧时间和刷新 -->
            <div class="d-flex align-items-center text-light">
                <span class="me-3 d-none d-md-inline clock-text" id="clock"></span>
                <button class="btn btn-sm btn-outline-light me-2" onclick="refreshPage()" title="刷新">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="/" class="nav-link-custom {% if active_page == 'home' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>总览仪表盘</span>
            </a>
            <!-- 新闻置顶 -->
            <a href="/news" class="nav-link-custom {% if active_page == 'news' %}active{% endif %}">
                <i class="bi bi-newspaper"></i>
                <span>新闻资讯</span>
            </a>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section-title">A股市场</div>
            <a href="/a-stock" class="nav-link-custom {% if active_page == 'a-stock' %}active{% endif %}">
                <i class="bi bi-graph-up"></i>
                <span>A股大盘</span>
            </a>
            <a href="/chinext" class="nav-link-custom {% if active_page == 'chinext' %}active{% endif %}">
                <i class="bi bi-lightning-charge"></i>
                <span>创业板/科创</span>
            </a>
            <a href="/sectors" class="nav-link-custom {% if active_page == 'sectors' %}active{% endif %}">
                <i class="bi bi-diagram-3"></i>
                <span>行业板块</span>
            </a>
            <a href="/fund-flow" class="nav-link-custom {% if active_page == 'fundflow' %}active{% endif %}">
                <i class="bi bi-cash-stack"></i>
                <span>资金流向</span>
            </a>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section-title">全球市场</div>
            <a href="/hk-stock" class="nav-link-custom {% if active_page == 'hk' %}active{% endif %}">
                <i class="bi bi-currency-exchange"></i>
                <span>港股分析</span>
            </a>
            <a href="/us-stock" class="nav-link-custom {% if active_page == 'us' %}active{% endif %}">
                <i class="bi bi-flag"></i>
                <span>美股K线</span>
            </a>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section-title">数据源</div>
            <a href="https://quote.eastmoney.com/" target="_blank" class="nav-link-custom">
                <i class="bi bi-box-arrow-up-right"></i>
                <span>东方财富</span>
            </a>
            <a href="https://www.10jqka.com.cn/" target="_blank" class="nav-link-custom">
                <i class="bi bi-box-arrow-up-right"></i>
                <span>同花顺</span>
            </a>
            <a href="https://finance.sina.com.cn/" target="_blank" class="nav-link-custom">
                <i class="bi bi-box-arrow-up-right"></i>
                <span>新浪财经</span>
            </a>
            <a href="https://gu.qq.com/" target="_blank" class="nav-link-custom">
                <i class="bi bi-box-arrow-up-right"></i>
                <span>腾讯财经</span>
            </a>
        </nav>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- 页脚 -->
    <footer class="footer-bar">
        <div class="container-fluid">
            <span class="text-muted">
                <i class="bi bi-info-circle"></i>
                数据来源：东方财富 · 同花顺 · 新浪财经 · 腾讯财经 | 仅供学习参考，不构成投资建议 | {{ current_time }}
            </span>
        </div>
    </footer>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 公共JS -->
    <script src="/static/js/common.js"></script>
    <!-- 页面JS -->
    {% block extra_js %}{% endblock %}
</body>
</html>

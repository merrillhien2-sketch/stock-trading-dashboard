{% extends "base.html" %}

{% block title %}404 - 页面不存在{% endblock %}

{% block content %}
<div class="container-fluid px-3 py-5">
    <div class="text-center" style="max-width:500px; margin:0 auto;">
        <div style="font-size:8rem; font-weight:700; color:var(--accent-color, #4d96ff); line-height:1;">404</div>
        <h4 class="mt-3 mb-2">页面不存在</h4>
        <p class="text-muted mb-4">您访问的页面不存在或已被移除，请检查URL是否正确。</p>
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>返回首页
        </a>
    </div>
</div>
{% endblock %}

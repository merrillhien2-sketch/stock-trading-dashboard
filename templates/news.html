{% extends "base.html" %}

{% block title %}交易决策仪表盘 - 新闻资讯中心{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="/static/css/news.css">
{% endblock %}

{% block content %}
<!-- 页面标题 + 搜索框 -->
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">
        <i class="bi bi-newspaper me-2" style="color: var(--color-accent);"></i>新闻资讯中心
    </h4>
    <div class="news-search-box">
        <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="newsSearchInput"
                   placeholder="搜索新闻关键词..." autocomplete="off">
            <button class="btn btn-outline-secondary" id="newsSearchBtn" type="button">
                <i class="bi bi-search"></i>
            </button>
            <button class="btn btn-outline-secondary" id="newsSearchClearBtn" type="button"
                    title="清除搜索" style="display:none;">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
</div>

<!-- 分类标签栏 -->
<div class="card-custom">
    <div class="category-bar" id="categoryBar">
        <button class="tag-btn active" data-category="all" onclick="switchCategory('all')">
            <i class="bi bi-grid"></i> 全部
        </button>
        <button class="tag-btn" data-category="policy" onclick="switchCategory('policy')">
            <i class="bi bi-bank"></i> 政策动态
        </button>
        <button class="tag-btn" data-category="finance" onclick="switchCategory('finance')">
            <i class="bi bi-cash-coin"></i> 财经要闻
        </button>
        <button class="tag-btn" data-category="tech" onclick="switchCategory('tech')">
            <i class="bi bi-cpu"></i> 科技科创
        </button>
        <button class="tag-btn" data-category="stock" onclick="switchCategory('stock')">
            <i class="bi bi-graph-up-arrow"></i> A股市场
        </button>
        <button class="tag-btn" data-category="global" onclick="switchCategory('global')">
            <i class="bi bi-globe"></i> 国际财经
        </button>
    </div>
</div>

<!-- 新闻列表 -->
<div class="card-custom">
    <div class="card-title-bar">
        <span class="card-title-text">
            <i class="bi bi-list-ul"></i>
            <span id="newsListTitle">全部新闻</span>
            <span class="search-result-tip" id="searchResultTip" style="display:none;"></span>
        </span>
        <span class="text-muted text-sm" id="newsCount">--</span>
    </div>

    <!-- 新闻列表容器 -->
    <div id="newsListContainer">
        <div class="loading-spinner">
            <div class="spinner-border spinner-border-sm"></div>
        </div>
    </div>

    <!-- 加载更多 -->
    <div class="text-center mt-3" id="loadMoreWrapper" style="display:none;">
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreNews()">
            <i class="bi bi-arrow-down-circle"></i> 加载更多
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/news.js"></script>
{% endblock %}
